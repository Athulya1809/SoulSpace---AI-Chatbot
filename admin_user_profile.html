<!DOCTYPE html>
<html>
<head>
<title>User Profile – Admin</title>
<style>
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: url("{{ url_for('static', filename='background2.jpeg') }}") no-repeat center center fixed;
    background-size: cover;
    color: white;
}
/* Dark overlay for readability */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: -1;
}
.container{
    max-width:900px;
    margin:80px auto;
    background:rgba(30,30,30,0.9);
    padding:30px;
    border-radius:18px;
}
.badge{
    padding:6px 12px;
    border-radius:20px;
    font-weight:bold;
}
.active{ background:#4caf50; color:black; }
.inactive{ background:#ff6b6b; color:black; }
button{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    cursor:pointer;
}
.deactivate{ background:#ff6b6b; }
.activate{ background:#4caf50; }
</style>
</head>
<body>

<div class="container">
<h2>👤 User Profile</h2>

<p><b>Username:</b> {{ user.username }}</p>
<p><b>Email:</b> {{ user.email }}</p>
<p>
<b>Status:</b>
<span class="badge {{ 'active' if user.is_active else 'inactive' }}">
    {{ 'Active' if user.is_active else 'Deactivated' }}
</span>
</p>

<p><b>Total Journal Entries:</b>
{{ user.mood_journal | length if user.mood_journal else 0 }}
</p>

<form method="POST" action="/admin/user/{{ user._id }}/toggle">
    {% if user.is_active %}
    <button class="deactivate">Deactivate User</button>
    {% else %}
    <button class="activate">Activate User</button>
    {% endif %}
</form>

<br>
<a href="/admin/users">← Back to Users</a>
</div>

</body>
</html>
