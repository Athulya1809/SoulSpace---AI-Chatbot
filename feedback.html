<!DOCTYPE html>
<html>
<head>
    <title>Feedback – SoulSpace</title>
    <style>
        body {
            margin:0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: url("{{ url_for('static', filename='background2.jpeg') }}") no-repeat center center fixed;
            background-size: cover;
            color:white;
        }

        body::before {
            content:"";
            position:fixed;
            width:100%;
            height:100%;
            background:rgba(0,0,0,0.6);
            z-index:-1;
        }

        /* Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            position: relative;
            z-index: 2;
        }

        .navbar h2 {
            color: #5cc8ff;
            margin: 0;
        }

        .navbar .nav-buttons a {
            color: white;
            text-decoration: none;
            border: 1px solid #5cc8ff;
            padding: 8px 14px;
            border-radius: 20px;
            margin-left: 10px;
            transition: all 0.3s ease;
        }

        .navbar .nav-buttons a:hover {
            background-color: #5cc8ff;
            color: black;
            box-shadow: 0 0 12px #5cc8ff;
        }

        .container{
            max-width:600px;
            margin:80px auto;
            background:rgba(0,0,0,0.8);
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px #5cc8ff;
        }

        h2{
            text-align:center;
            color:#5cc8ff;
        }

        textarea{
            width:100%;
            height:80px;
            border-radius:8px;
            padding:10px;
            border:none;
            margin-bottom:15px;
        }

        .stars{
            text-align:center;
            margin-bottom:20px;
        }

        .star{
            font-size:30px;
            cursor:pointer;
            color:gray;
        }

        .star.selected{
            color:gold;
        }

        button{
            width:100%;
            padding:12px;
            background:linear-gradient(135deg,#5cc8ff,#3ea6ff);
            border:none;
            border-radius:25px;
            font-size:16px;
            cursor:pointer;
        }
    </style>
</head>
<body>
<!-- NAVBAR -->
<div class="navbar">
    <h2>SoulSpace</h2>

    <div class="nav-buttons">
        <a href="/profile">Back</a>
        <a href="/dashboard">Home</a>
    </div>
</div>
<div class="container">
    <h2>We Value Your Feedback 💬</h2>

    <form method="POST" action="/submit_feedback">

        <label>1️⃣ Feedback about Website</label>
        <textarea name="website_feedback" required></textarea>

        <label>2️⃣ Feedback about AI Chat</label>
        <textarea name="ai_feedback" required></textarea>

        <label>⭐ Rate Your Experience</label>
        <div class="stars">
            <span class="star" onclick="selectStar(1)">★</span>
            <span class="star" onclick="selectStar(2)">★</span>
            <span class="star" onclick="selectStar(3)">★</span>
            <span class="star" onclick="selectStar(4)">★</span>
            <span class="star" onclick="selectStar(5)">★</span>
        </div>

        <input type="hidden" name="rating" id="rating" required>

        <button type="submit">Submit Feedback</button>
    </form>
</div>

<script>
function selectStar(value){
    document.getElementById("rating").value = value;

    var stars = document.querySelectorAll(".star");

    for (var i = 0; i < stars.length; i++) {
        if (i < value) {
            stars[i].classList.add("selected");
        } else {
            stars[i].classList.remove("selected");
        }
    }
}
</script>

</body>
</html>
