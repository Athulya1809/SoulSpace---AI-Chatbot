<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>
    <style>
      body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: url("{{ url_for('static', filename='background2.jpeg') }}") no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* Dark overlay */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: -1;
}

/* Header */
.header {
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(8px);
}

.header h2 {
    color: #5cc8ff;
    margin: 0;
}

.header a {
    color: white;
    text-decoration: none;
    border: 1px solid #5cc8ff;
    padding: 8px 14px;
    border-radius: 20px;
    transition: all 0.3s ease;
}

.header a:hover {
    background: #5cc8ff;
    color: black;
    box-shadow: 0 0 12px #5cc8ff;
}

/* Register Box */
.register-box {
    width: 380px;
    margin: 120px auto;
    padding: 30px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(92, 200, 255, 0.4);
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
}

/* Register Button */
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: linear-gradient(135deg, #5cc8ff, #3ea6ff);
    border: none;
    color: black;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    box-shadow: 0 0 18px rgba(92, 200, 255, 0.8);
}

.error {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 5px;
}

/* Success Toast */
.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: linear-gradient(135deg, #5cc8ff, #3ea6ff);
    color: black;
    padding: 15px 25px;
    border-radius: 10px;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(92, 200, 255, 0.6);
    animation: slideIn 0.6s ease;
    z-index: 1000;
}

@keyframes slideIn {
    from {
        transform: translateX(300px);
        opacity: 0;
    }
    to {
        transform: translateX(0);
        opacity: 1;
    }
}
    </style>
</head>
<body>
<div class="orb one"></div>
<div class="orb two"></div>

<div class="header">
    <h2>Register</h2>
    <a href="/">Back</a>
</div>
<div class="register-box">
    <h2>Sign Up</h2>

    {% if error %}
    <div style="background:#b71c1c;padding:10px;border-radius:5px;margin-bottom:10px;text-align:center;">
    {{ error }}
    </div>
    {% endif %}

    {% if success %}
    <div style="
    background:#1b5e20;
    padding:10px;
    border-radius:5px;
    margin-bottom:10px;
    text-align:center;">
    {{ success }}
    </div>
    {% endif %}

    <form method="POST" action="/register" onsubmit="return validateForm()">
        <input type="text" id="username" name="username" placeholder="Username">
        <div id="userError" class="error"></div>

        <input type="email" id="email" name="email" placeholder="Email">
        <div id="emailError" class="error"></div>

        <input type="password" id="password" name="password" placeholder="Password">
        <div id="passError" class="error"></div>

        <input type="password" id="confirmPassword" placeholder="Confirm Password">
        <div id="confirmError" class="error"></div>

        <button type="submit">Register</button>
    </form>
</div>

<script>
function validateForm() {
    let valid = true;

    // Clear errors
    document.querySelectorAll(".error").forEach(e => e.innerText = "");

    let username = document.getElementById("username").value.trim();
    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;
    let confirmPassword = document.getElementById("confirmPassword").value;

    // Username validation
    if (username.length < 3) {
        document.getElementById("userError").innerText =
            "Username must be at least 3 characters";
        valid = false;
    }

    // Email validation
    let emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;
    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerText =
            "Only Gmail addresses are allowed (example@gmail.com)";
        valid = false;
    }

    // Password validation
    if (password.length < 6) {
        document.getElementById("passError").innerText =
            "Password must be at least 6 characters";
        valid = false;
    }

    // Confirm password
    if (password !== confirmPassword) {
        document.getElementById("confirmError").innerText =
            "Passwords do not match";
        valid = false;
    }

    return valid;
}
</script>

{% if success %}
<div id="successToast" class="toast">
✅ Registration Successful! Redirecting to Login...
</div>

<script>
setTimeout(function(){
    window.location.href="/login";
},2000);
</script>
{% endif %}

</body>
</html>
