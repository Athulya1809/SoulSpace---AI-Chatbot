<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <style>
        body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: url("{{ url_for('static', filename='background2.jpeg') }}") no-repeat center center fixed;
    background-size: cover;
    color: white;
}

/* Dark overlay for readability */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: -1;
}

/* Header */
.header {
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(8px);
}

.header h2 {
    color: #5cc8ff;
    margin: 0;
}

.header a {
    color: white;
    text-decoration: none;
    border: 1px solid #5cc8ff;
    padding: 8px 14px;
    border-radius: 20px;
    transition: all 0.3s ease;
}

.header a:hover {
    background: #5cc8ff;
    color: black;
    box-shadow: 0 0 12px #5cc8ff;
}

/* Login Box */
.login-box {
    width: 360px;
    margin: 120px auto;
    padding: 30px;
    background: rgba(0, 0, 0, 0.75);
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(92, 200, 255, 0.4);
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

h2 {
    text-align: center;
}

/* Inputs */
input {
    width: 100%;
    padding: 10px;
    margin-top: 10px;
    border-radius: 6px;
    border: none;
}

/* Button */
button {
    width: 100%;
    padding: 10px;
    margin-top: 15px;
    background: linear-gradient(135deg, #5cc8ff, #3ea6ff);
    border: none;
    color: black;
    font-size: 16px;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    box-shadow: 0 0 18px rgba(92, 200, 255, 0.8);
}

.error {
    color: #ff6b6b;
    font-size: 14px;
    margin-top: 5px;
}       
    </style>
</head>
<body>
<div class="header">
    <h2>Login</h2>
    <a href="/">Back</a>
</div>

<div class="login-box">
    <h2>Login</h2>

    {% if error %}
    <div class="error" style="text-align:center;margin-bottom:10px;">
    {{ error }}
    </div>
    {% endif %}

    {% if not_found %}
    <div style="background:#2c0b0b;padding:12px;border-radius:8px;margin-bottom:15px;text-align:center;">
    ⚠ Account not found. Please register first.
    <br><br>
    <button onclick="location.href='/register'">
    Register Now
    </button>
    </div>
    {% endif %}

    <form method="POST" action="/login" onsubmit="return validateLogin()">
        <input type="email" id="email" name="email" placeholder="Email">
        <div id="emailError" class="error"></div>

        <input type="password" id="password" name="password" placeholder="Password">
        <div id="passError" class="error"></div>

        <button type="submit">Login</button>
    </form>
</div>

<script>
function validateLogin() {
    let valid = true;

    document.getElementById("emailError").innerText = "";
    document.getElementById("passError").innerText = "";

    let email = document.getElementById("email").value.trim();
    let password = document.getElementById("password").value;

    // Email validation
    let emailPattern = /^[a-zA-Z0-9._%+-]+@gmail\.com$/;

    if (!emailPattern.test(email)) {
        document.getElementById("emailError").innerText =
            "Enter a valid Gmail address";
        valid = false;
    }

    // Password validation
    if (password.length < 6) {
        document.getElementById("passError").innerText =
            "Password must be at least 6 characters";
        valid = false;
    }

    return valid;
}
</script>

</body>
</html>
