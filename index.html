<!DOCTYPE html>
<html>
<head>
    <title>MindCare – Mental Wellness Chatbot</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            display: flex;
            height: 100vh;
        }

        /* Left section (Text & Buttons) */
        .left {
            flex: 1;
            padding: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left h1 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #5cc8ff;
        }

        .left p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .top-bar {
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .menu-icon {
            font-size: 28px;
            cursor: pointer;
            color: white;
        }

        /* Dropdown Menu */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            margin-top: 10px;
            background: #1e1e1e;
            min-width: 180px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        .dropdown-menu a {
            display: block;
            padding: 12px;
            color: white;
            text-decoration: none;
            transition: background 0.3s;
        }

        .dropdown-menu a:hover {
            background: #5cc8ff;
        }

        .show {
            display: block;
        }

        .bg-video {
            position: fixed;
            top: 0;
            left: 0;
            min-width: 100%;
            min-height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: -1;
        }

    </style>
</head>
<body>
<video autoplay muted loop playsinline class="bg-video">
    <source src="{{ url_for('static', filename='background1.mp4') }}" type="video/mp4">
</video>

<div class="video-overlay"></div>
<div class="top-bar">
    <div class="menu-icon" onclick="toggleMenu()">☰</div>

    <div id="dropdownMenu" class="dropdown-menu">
        <a href="/login">Login</a>
        <a href="/register">Register</a>
        <a href="/google_login">Sign in with Google</a>
        <a href="/admin/login">Admin</a>
    </div>
</div>

<div class="container">
    <div class="left">
        <h1>SoulSpace</h1>
        <p>
            Your personal AI companion for emotional support, stress relief,<br>
            and a friend to listen. Talk freely, feel understood, and relax anytime.
        </p>
    </div>
</div>

<script>
function toggleMenu() {
    const menu = document.getElementById("dropdownMenu");
    menu.classList.toggle("show");
}

window.onclick = function(event) {
    if (!event.target.matches('.menu-icon')) {
        const dropdown = document.getElementById("dropdownMenu");
        if (dropdown.classList.contains('show')) {
            dropdown.classList.remove('show');
        }
    }
}
</script>
</body>
</html>
