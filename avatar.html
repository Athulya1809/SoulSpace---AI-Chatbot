<!DOCTYPE html>
<html>
<head>
<title>Create Your Avatar</title>

<style>
body{
margin:0;
font-family:"Segoe UI";
background: url("{{ url_for('static', filename='act4.jpeg') }}") no-repeat center center fixed;
background-size: cover;
color:white;
}

/* Dark overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.65);
z-index:-1;
}

/* Header */
.header{
padding:15px 30px;
background:rgba(0,0,0,0.6);
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(8px);
position:relative;
z-index:2;
}

.header h2{
color:#5cc8ff;
margin:0;
}

/* Back button */
.header a{
color:white;
text-decoration:none;
border:1px solid #5cc8ff;
padding:8px 14px;
border-radius:20px;
transition:all 0.3s ease;
}

.header a:hover{
background:#5cc8ff;
color:black;
box-shadow:0 0 12px #5cc8ff;
}

/* Container */
.container{
max-width:700px;
margin:40px auto;
background:rgba(0,0,0,0.75);
padding:30px;
border-radius:20px;
box-shadow:0 0 25px rgba(92,200,255,0.4);
animation:fadeUp 0.8s ease;
position:relative;
z-index:2;
}

h3{
color:#5cc8ff;
}

/* Inputs */
input,select{
width:100%;
padding:12px;
margin-top:10px;
margin-bottom:20px;
border:none;
border-radius:10px;
}

/* Avatar Grid */
.avatar-grid{
display:grid;
grid-template-columns:repeat(4,1fr); 
gap:15px;
max-height:250px;   
overflow-y:auto;    
padding-right:5px;
}

.avatar-grid img{
width:80px;
height:80px;
border-radius:50%;
cursor:pointer;
border:3px solid transparent;
transition:all 0.3s ease;
}

.avatar-grid img:hover{
border:3px solid #5cc8ff;
transform:scale(1.05);
}

/* Selected Avatar */
.selected-avatar{
border:3px solid #5cc8ff !important;
box-shadow:0 0 20px #5cc8ff;
transform:scale(1.1);
}

/* Button */
button{
padding:12px 25px;
border:none;
border-radius:25px;
background:linear-gradient(135deg,#5cc8ff,#3ea6ff);
cursor:pointer;
color:black;
transition:all 0.3s ease;
}

button:hover{
box-shadow:0 0 20px rgba(92,200,255,1);
transform:scale(1.05);
}

/* Animation */
@keyframes fadeUp{
from{opacity:0; transform:translateY(20px);}
to{opacity:1; transform:translateY(0);}
}

</style>
</head>

<body>

<div class="header">
<h2>Avatar Creation 🤖</h2>
<a href="/activities">Back</a>
</div>

<div class="container">

<form action="/save_avatar" method="POST">

<h3>Choose Avatar</h3>

<div class="avatar-grid">
<img src="/static/avatar1.png" onclick="selectAvatar('avatar1.png', this)">
<img src="/static/avatar2.png" onclick="selectAvatar('avatar2.png', this)">
<img src="/static/avatar3.png" onclick="selectAvatar('avatar3.png', this)">
<img src="/static/avatar4.png" onclick="selectAvatar('avatar4.png', this)">
<img src="/static/avatar5.png" onclick="selectAvatar('avatar5.png', this)">
<img src="/static/avatar6.png" onclick="selectAvatar('avatar6.png', this)">
<img src="/static/avatar7.png" onclick="selectAvatar('avatar7.png', this)">
<img src="/static/avatar8.png" onclick="selectAvatar('avatar8.png', this)">
<img src="/static/avatar9.png" onclick="selectAvatar('avatar9.png', this)">
<img src="/static/avatar10.png" onclick="selectAvatar('avatar10.png', this)">
<img src="/static/avatar11.png" onclick="selectAvatar('avatar11.png', this)">
<img src="/static/avatar12.png" onclick="selectAvatar('avatar12.png', this)">
</div>

<input type="hidden" name="avatar_type" id="avatar_type">

<h3>Avatar Name</h3>
<input type="text" name="avatar_name" required>

<h3>Personality</h3>
<select name="avatar_personality">
<option>Calm</option>
<option>Friendly</option>
<option>Motivational</option>
<option>Listener</option>
</select>

<button type="submit">Save Avatar</button>

</form>

</div>

<script>
function selectAvatar(type, element){
    document.getElementById("avatar_type").value = type;
    let avatars = document.querySelectorAll(".avatar-grid img");
    avatars.forEach(img => {
        img.classList.remove("selected-avatar");
    });
    element.classList.add("selected-avatar");
}
</script>

</body>
</html>
