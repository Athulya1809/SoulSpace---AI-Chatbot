<!DOCTYPE html>
<html>
<head>
<title>Admin Login – MindCare</title>

<style>
/* BODY */
body {
    margin: 0;
    font-family: "Segoe UI", Arial, sans-serif;
    background: url("{{ url_for('static', filename='background2.jpeg') }}") no-repeat center center fixed;
    background-size: cover;
    color: white;
}
/* Dark overlay for readability */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.6);
    z-index: -1;
}

/* Header */
.header {
    background: rgba(0, 0, 0, 0.6);
    padding: 15px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    backdrop-filter: blur(8px);
}

.header h2 {
    color: #5cc8ff;
    margin: 0;
}

.header a {
    color: white;
    text-decoration: none;
    border: 1px solid #5cc8ff;
    padding: 8px 14px;
    border-radius: 20px;
    transition: all 0.3s ease;
}

.header a:hover {
    background: #5cc8ff;
    color: black;
    box-shadow: 0 0 12px #5cc8ff;
}

/* LOGIN BOX */
.login-box{
    width:360px;
    margin:120px auto;
    padding:30px;
    background:rgba(0,0,0,0.75);
    border-radius:18px;
    box-shadow:0 0 25px rgba(92,200,255,0.4);
    position:relative;
    z-index:2;
    animation:fadeUp 0.6s ease;
}

.login-box h3{
    text-align:center;
    margin-bottom:20px;
}

/* INPUTS */
input{
    width:100%;
    padding:10px;
    margin-top:12px;
    border-radius:8px;
    border:none;
    outline:none;
}

/* BUTTON */
button{
    width:100%;
    padding:10px;
    margin-top:18px;
    background:linear-gradient(135deg, #5cc8ff, #3ea6ff);
    border:none;
    color:black;
    font-size:16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}
button:hover {
    box-shadow: 0 0 18px rgba(92, 200, 255, 0.8);
}

/* ERROR */
.error{
    color:#ff6b6b;
    font-size:14px;
    margin-top:10px;
    text-align:center;
}

/* ANIMATION */
@keyframes fadeUp{
    from{opacity:0; transform:translateY(20px);}
    to{opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <h2>👑 Admin Login</h2>
    <a href="/">Back</a>
</div>

<!-- LOGIN BOX -->
<div class="login-box">

    <h3>Admin Access</h3>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="email" name="email" placeholder="Admin Email" required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Login</button>
    </form>

</div>

</body>
</html>
